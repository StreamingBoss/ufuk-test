  } catch (err) { fehler.textContent = 'Der Zugangscode ist nicht richtig. Bitte noch einmal versuchen.'; }
});
(async () => {
  const key = ADMIN_ONLY ? ADMIN_CODE : SESSION_KEY, saved = sget(key);
  if (!saved) return;
  fehler.textContent = 'Einen Moment …';
  try { show(await decryptWith(saved), saved); }
  catch (err) { if (!ADMIN_ONLY) sdel(SESSION_KEY); fehler.textContent = ''; document.documentElement.className = ''; }   // the remembered code failed: now the form may show
})();
