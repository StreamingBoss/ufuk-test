const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fehler = document.getElementById('fehler'); fehler.textContent = 'Einen Moment …';
  try {
    const code = document.getElementById('c').value.trim();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(BLOB.salt), iterations: BLOB.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(BLOB.iv) }, key, ub(BLOB.data));
    const html = new TextDecoder().decode(plain);
    // Runtime handoff only; never stored or embedded in the published ciphertext wrapper.
    if (html.includes('const SYNC_CONFIG =')) window.__UFUK_UNLOCK_CODE__ = code;
    document.open(); document.write(html); document.close();
